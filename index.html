<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mozkoli - Empowering African Creators</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header Section -->
    <header>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#discover">Discover</a></li>
                <li><a href="#create">Create</a></li>
                <li><a href="#community">Community</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="container">
            <h1>Welcome to Mozkoli</h1>
            <p>Empowering African creators, globally</p>
            <button>Sign Up</button>
        </div>
    </section>

    <!-- Discover Section -->
    <section id="discover">
        <div class="container">
            <h2>Discover New Content</h2>
            <div class="discover-grid">
                <!-- Grid items will be populated dynamically -->
            </div>
        </div>
    </section>

    <!-- Create Section -->
    <section id="create">
        <div class="container">
            <h2>Create Your Own Content</h2>
            <form>
                <!-- Form fields will be added here -->
            </form>
        </div>
    </section>

    <!-- Community Section -->
    <section id="community">
        <div class="container">
            <h2>Join Our Community</h2>
            <div class="community-grid">
                <!-- Grid items will be populated dynamically -->
            </div>
        </div>
    </section>

    <!-- Footer Section -->
    <footer>
        <div class="container">
            <p>&copy; 2023 Mozkoli. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
